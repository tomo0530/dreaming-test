# E4: CL-Bench database_exploration / schema_drift anchor (40 questions as 8 sessions of 5;
# the drift falls between sessions 4 and 5). seeds are the official run indices; the query
# limit (15), row cap and SQL timeout of the questions come from the CL-Bench adapter.
name: clbench
phase: clbench
task: clbench
arms: [A0, A1, A4]
stream_ids: [clbench-r0, clbench-r1, clbench-r2]
seeds: [0, 1, 2]
sessions: 8
questions_per_session: 5
inject_false_notes: false
agent_model: gpt-6-luna
consolidator_model: gpt-6-luna
embedding_model: text-embedding-3-large
agent_reasoning_effort: low
consolidator_reasoning_effort: medium
probe_sessions: []
probes_per_checkpoint: 8
concurrency: 4
budgets:
  phase_cap_usd: 10
  hard_cap_usd: 200.0
  injected_tokens: 2000
  max_input_tokens_per_call: 64000
  online:
    max_turns: 17
    max_queries: 8
    max_completion_tokens: 2048
    memory_read_tokens: 6000
    sql_row_limit: 50
    sql_timeout_s: 10.0
  consolidation:
    analyzer_max_turns: 10
    organizer_max_turns: 12
    max_completion_tokens: 4096
    max_input_tokens_per_run: 900000
