# E3: main run. stream_ids/seeds are cut to N and questions_per_session set to q when the gate fixes the scale; phase_cap_usd becomes 130 only if the scale rule needs the stretch.
name: main
phase: main
task: schemadrift
arms: [A0, A1, A2, A3, A4, A5]
stream_ids:
  - main-01
  - main-02
  - main-03
  - main-04
  - main-05
  - main-06
  - main-07
  - main-08
  - main-09
  - main-10
  - main-11
  - main-12
  - main-13
  - main-14
  - main-15
  - main-16
  - main-17
  - main-18
  - main-19
  - main-20
