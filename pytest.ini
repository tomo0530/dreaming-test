[pytest]
testpaths =
    project_module/tests
python_files = test_*.py
addopts =
    -v
    --strict-markers
    --ff
    -m "not integrate and not slow"
    --cov=project_module/src/project_module
    --cov-branch
    --cov-report=term-missing
markers =
    integrate: Tests that call paid external APIs (Azure Foundry); excluded by default
    slow:      Long-running tests
