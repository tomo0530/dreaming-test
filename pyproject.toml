[project]
name = "dreaming-test"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
]

[tool.uv]
default-groups = "all"
# Dependency cooldowns: Exclude recently released packages to mitigate supply chain attack risks.
# Adjust the duration based on your project's security requirements (e.g., "24 hours", "3 days", "1 week", "30 days").
# Ref: https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
exclude-newer = "1 week"
# Security floors for transitive dependencies. These are not direct dependencies,
# so constraining them here keeps the floor in effect no matter which dependency
# group pulls them in, and without declaring them as direct dependencies.
# Ref: https://docs.astral.sh/uv/reference/settings/#constraint-dependencies
constraint-dependencies = [
    # urllib3 is pulled in transitively (requests via tiktoken). >= 2.8.0 fixes
    # HIGH vulnerabilities (GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77) and
    # GHSA-gh4c-6fx4-qh6g.
    "urllib3>=2.8.0",
    # certifi is pulled in transitively (httpx / requests). >= 2026.10.19
    # removes the emSign ECC Root CA - G3 root whose intermediate CA keys are
    # compromised (CRITICAL, GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.19",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_module"
module-root = "project_module/src"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
